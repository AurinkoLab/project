<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Чертёж AL-GK-01 — Кронштейн педали</title>
<style>
  body{margin:0;background:#F4F2EA;font-family:'Segoe UI',Arial,sans-serif;color:#3A3831;
       display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px}
  .sheet{width:100%;max-width:1100px;background:#FBFAF6;border:1px solid #D8D3C4;border-radius:12px;
         box-shadow:0 10px 40px rgba(58,56,49,.10);overflow:hidden}
  svg{width:100%;height:auto;display:block}
  @media print{
    @page{size:A4 landscape;margin:8mm}
    body{background:#fff;padding:0;min-height:auto}
    .sheet{border:none;box-shadow:none;border-radius:0;max-width:none}
  }
</style>
</head>
<body>
<div class="sheet">
<svg viewBox="0 0 1000 660" xmlns="http://www.w3.org/2000/svg"
     font-family="'Segoe UI',Arial,sans-serif" role="img"
     aria-label="Чертёж кронштейна педали AL-GK-01">

  <defs>
    <marker id="arE" markerWidth="11" markerHeight="9" refX="10" refY="4.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L10,4.5 L0,9 Z" fill="#3A3831"/>
    </marker>
    <marker id="arS" markerWidth="11" markerHeight="9" refX="1" refY="4.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M10,0 L0,4.5 L10,9 Z" fill="#3A3831"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1000" height="660" fill="#FBFAF6"/>

  <!-- Рамка чертежа -->
  <rect x="10" y="10" width="980" height="640" fill="none" stroke="#3A3831" stroke-width="1"/>
  <rect x="40" y="25" width="935" height="610" fill="none" stroke="#3A3831" stroke-width="2"/>

  <!-- ================= ВИД СПЕРЕДИ ================= -->
  <!-- Контур детали 180 x 90 мм, R8, масштаб 2.5 px/мм -->
  <path d="M210,205 H620 A20,20 0 0 1 640,225 V410 A20,20 0 0 1 620,430 H210
           A20,20 0 0 1 190,410 V225 A20,20 0 0 1 210,205 Z"
        fill="#EFECE1" stroke="#3A3831" stroke-width="2.5" stroke-linejoin="round"/>

  <!-- Осевые линии -->
  <g stroke="#3A3831" stroke-width="0.9" stroke-dasharray="14 4 3 4" opacity=".85">
    <line x1="245" y1="380" x2="590" y2="380"/>
    <line x1="265" y1="358" x2="265" y2="402"/>
    <line x1="565" y1="358" x2="565" y2="402"/>
    <line x1="415" y1="243" x2="415" y2="292"/>
    <line x1="390" y1="267.5" x2="440" y2="267.5"/>
    <line x1="505" y1="275" x2="625" y2="275"/>
  </g>

  <!-- Отверстия -->
  <circle cx="265" cy="380" r="10.6" fill="#FBFAF6" stroke="#3A3831" stroke-width="2.5"/>
  <circle cx="565" cy="380" r="10.6" fill="#FBFAF6" stroke="#3A3831" stroke-width="2.5"/>
  <circle cx="415" cy="267.5" r="13.1" fill="#FBFAF6" stroke="#3A3831" stroke-width="2.5"/>

  <!-- Паз 8 x 30 -->
  <path d="M537.5,265 H592.5 A10,10 0 0 1 592.5,285 H537.5 A10,10 0 0 1 537.5,265 Z"
        fill="#FBFAF6" stroke="#3A3831" stroke-width="2.5"/>

  <!-- ===== Размеры снизу, цепочка 1 ===== -->
  <g stroke="#3A3831" stroke-width="0.9">
    <line x1="190" y1="436" x2="190" y2="488"/>
    <line x1="265" y1="392" x2="265" y2="488"/>
    <line x1="565" y1="392" x2="565" y2="488"/>
    <line x1="640" y1="436" x2="640" y2="488"/>
  </g>
  <g stroke="#3A3831" stroke-width="1.1" marker-start="url(#arS)" marker-end="url(#arE)">
    <line x1="190" y1="478" x2="265" y2="478"/>
    <line x1="265" y1="478" x2="565" y2="478"/>
    <line x1="565" y1="478" x2="640" y2="478"/>
  </g>
  <g font-size="15" fill="#3A3831" text-anchor="middle">
    <rect x="212" y="463" width="30" height="17" fill="#FBFAF6"/><text x="227" y="476">30</text>
    <rect x="396" y="463" width="38" height="17" fill="#FBFAF6"/><text x="415" y="476">120</text>
  </g>
  <rect x="586" y="461" width="34" height="20" fill="#FBFAF6"/>
  <text x="603" y="477" font-size="18" font-weight="700" fill="#C4653F" text-anchor="middle">X</text>

  <!-- ===== Размер снизу, цепочка 2 (габарит) ===== -->
  <g stroke="#3A3831" stroke-width="0.9">
    <line x1="190" y1="488" x2="190" y2="525"/>
    <line x1="640" y1="488" x2="640" y2="525"/>
  </g>
  <line x1="190" y1="515" x2="640" y2="515" stroke="#3A3831" stroke-width="1.1"
        marker-start="url(#arS)" marker-end="url(#arE)"/>
  <rect x="392" y="500" width="46" height="17" fill="#FBFAF6"/>
  <text x="415" y="513" font-size="15" fill="#3A3831" text-anchor="middle">180</text>

  <!-- ===== Размеры слева ===== -->
  <g stroke="#3A3831" stroke-width="0.9">
    <line x1="184" y1="430" x2="70" y2="430"/>
    <line x1="245" y1="380" x2="144" y2="380"/>
    <line x1="184" y1="267.5" x2="107" y2="267.5"/>
    <line x1="184" y1="205" x2="70" y2="205"/>
  </g>
  <g stroke="#3A3831" stroke-width="1.1" marker-start="url(#arS)" marker-end="url(#arE)">
    <line x1="152" y1="430" x2="152" y2="380"/>
    <line x1="115" y1="430" x2="115" y2="267.5"/>
    <line x1="78" y1="430" x2="78" y2="205"/>
  </g>
  <g font-size="15" fill="#3A3831" text-anchor="middle">
    <rect x="139" y="396" width="26" height="17" fill="#FBFAF6"/><text x="152" y="409">20</text>
    <rect x="102" y="341" width="26" height="17" fill="#FBFAF6"/><text x="115" y="354">65</text>
    <rect x="65" y="309" width="26" height="17" fill="#FBFAF6"/><text x="78" y="322">90</text>
  </g>

  <!-- ===== Размер сверху: положение центрального отверстия ===== -->
  <g stroke="#3A3831" stroke-width="0.9">
    <line x1="190" y1="199" x2="190" y2="155"/>
    <line x1="415" y1="243" x2="415" y2="155"/>
  </g>
  <line x1="190" y1="166" x2="415" y2="166" stroke="#3A3831" stroke-width="1.1"
        marker-start="url(#arS)" marker-end="url(#arE)"/>
  <rect x="286" y="151" width="34" height="17" fill="#FBFAF6"/>
  <text x="303" y="164" font-size="15" fill="#3A3831" text-anchor="middle">90</text>

  <!-- ===== Размер справа: высота паза ===== -->
  <g stroke="#3A3831" stroke-width="0.9">
    <line x1="646" y1="430" x2="712" y2="430"/>
    <line x1="625" y1="275" x2="712" y2="275"/>
  </g>
  <line x1="702" y1="430" x2="702" y2="275" stroke="#3A3831" stroke-width="1.1"
        marker-start="url(#arS)" marker-end="url(#arE)"/>
  <rect x="689" y="344" width="26" height="17" fill="#FBFAF6"/>
  <text x="702" y="357" font-size="15" fill="#3A3831" text-anchor="middle">62</text>

  <!-- ===== Выноски ===== -->
  <!-- Ø10,5 -->
  <g stroke="#3A3831" stroke-width="1.1" fill="none">
    <path d="M424,258 L492,182 H556"/>
  </g>
  <circle cx="424" cy="258" r="2.6" fill="#3A3831"/>
  <text x="496" y="176" font-size="15" fill="#3A3831">&#8709;10,5</text>

  <!-- 2 отв. Ø8,5 -->
  <g stroke="#3A3831" stroke-width="1.1" fill="none">
    <path d="M257,389 L200,452 H168"/>
  </g>
  <circle cx="257" cy="389" r="2.6" fill="#3A3831"/>
  <text x="164" y="447" font-size="15" fill="#3A3831" text-anchor="end">2 отв. &#8709;8,5</text>

  <!-- Паз -->
  <g stroke="#3A3831" stroke-width="1.1" fill="none">
    <path d="M596,266 L648,228 H726"/>
  </g>
  <circle cx="596" cy="266" r="2.6" fill="#3A3831"/>
  <text x="652" y="222" font-size="15" fill="#3A3831">Паз 8&#215;30</text>

  <!-- R8 -->
  <g stroke="#3A3831" stroke-width="1.1" fill="none">
    <path d="M196,212 L150,182 H120"/>
  </g>
  <circle cx="196" cy="212" r="2.6" fill="#3A3831"/>
  <text x="116" y="177" font-size="15" fill="#3A3831" text-anchor="end">R8</text>

  <text x="415" y="453" font-size="13" fill="#827D70" text-anchor="middle" letter-spacing="1.5">ВИД СПЕРЕДИ</text>

  <!-- ================= ВИД СБОКУ ================= -->
  <rect x="800" y="205" width="10" height="225" fill="#EFECE1" stroke="#3A3831" stroke-width="2.5"/>
  <g stroke="#3A3831" stroke-width="1.1" fill="none">
    <path d="M812,300 L846,300"/>
  </g>
  <text x="852" y="305" font-size="15" fill="#3A3831">4</text>
  <text x="805" y="453" font-size="13" fill="#827D70" text-anchor="middle" letter-spacing="1.5">ВИД СБОКУ</text>

  <!-- ================= ОСНОВНАЯ НАДПИСЬ ================= -->
  <g stroke="#3A3831" stroke-width="1.6" fill="none">
    <rect x="660" y="495" width="315" height="140"/>
    <line x1="660" y1="540" x2="975" y2="540"/>
    <line x1="660" y1="571" x2="975" y2="571"/>
    <line x1="660" y1="602" x2="975" y2="602"/>
    <line x1="820" y1="540" x2="820" y2="602"/>
  </g>
  <text x="674" y="514" font-size="11" fill="#827D70" letter-spacing="1">AURINKOLAB &#183; ПРОЕКТ GO-KART</text>
  <text x="674" y="533" font-size="19" font-weight="700" fill="#3A3831">Кронштейн педали</text>
  <g font-size="12.5" fill="#3A3831">
    <text x="674" y="559"><tspan fill="#827D70">Материал: </tspan>Сталь S235</text>
    <text x="834" y="559"><tspan fill="#827D70">Толщина: </tspan>4 мм</text>
    <text x="674" y="590"><tspan fill="#827D70">Масштаб: </tspan>1:2</text>
    <text x="834" y="590"><tspan fill="#827D70">Кол-во: </tspan>2 шт.</text>
    <text x="674" y="621"><tspan fill="#827D70">Обозначение: </tspan>AL-GK-01</text>
  </g>

  <!-- Примечания -->
  <g font-size="12.5" fill="#5C594E">
    <text x="52" y="573">1. Все размеры в миллиметрах.</text>
    <text x="52" y="594">2. Радиусы всех наружных углов R8.</text>
    <text x="52" y="615">3. Острые кромки притупить, заусенцы удалить.</text>
  </g>

</svg>
</div>
</body>
</html>
